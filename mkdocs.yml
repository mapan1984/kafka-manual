site_name: kafka 使用手册
site_url: https://mapan1984.github.io/kafka-manual/
repo_url: https://github.com/mapan1984/kafka-manual/
site_description: kafka 使用手册
site_author: mapan

nav:
  - 1. 基础操作: 'README.md'
  - 2. 其他操作:
    - 2.1 动态参数: '1-基础操作/dynamic-config.md'
    - 2.2 性能测试: '1-基础操作/perf-test.md'
    - 2.3 诊断工具: '1-基础操作/diagnostics.md'
    - 2.4 选举 leader: '1-基础操作/leader-election.md'
    - 2.5 分区重分配:
      - '2-其他操作/分区重分配/index.md'
      - 2.5.1 限流计算: '2-其他操作/分区重分配/throttle-calc.md'
    - 2.6 手动迁移分区数据: '2-其他操作/kafka-move-partiton.md'
    - 2.7 版本升级: '2-其他操作/kafka-upgrade.md'
    - 2.8 转发服务: '2-其他操作/kafka-proxy.md'
    - 2.9 理论极限性能预估: '2-其他操作/kafka-performance-estimate.md'
    - 2.10 附录-批量脚本: '1-基础操作/batch-scripts.md'
  - 3. 常用配置:
    - '3-常用配置/index.md'
    - 3.0 os config: '3-常用配置/0-os-config.md'
    - 3.1 jvm config: '3-常用配置/1-jvm-config.md'
    - 3.2 borker config: '3-常用配置/2-broker-config.md'
    - 3.3 topic config: '3-常用配置/3-topic-config.md'
    - 3.4 producer config: '3-常用配置/4-producer-config.md'
    - 3.5 consumer config: '3-常用配置/5-consumer-config.md'
    - 3.6 other: '3-常用配置/6-other.md'
  - 4. 认证/鉴权/加密: /kafka-security" target="_blank
  - 5. KRaft: '4-KRaft/index.md'
  - 6. 监控:
    - '5-监控/index.md'
    - 6.1 获取监控: '5-监控/1-获取监控.md'
    - 6.2 监控项:
      - 6.2.1 broker 监控: '5-监控/2-监控项/1-broker.md'
      - 6.2.2 connector 监控: '5-监控/2-监控项/2-connector.md'
      - 6.2.3 consumer 监控: '5-监控/2-监控项/3-consumer.md'
    - 6.3 rules 配置: '5-监控/3-rules配置.md'

theme:
  # name: readthedocs
  name: material
  language: 'zh'
  features:
    - navigation.expand
    - navigation.top
    - content.tabs.link
  # palette:
  #   scheme: slate
  #   primary: blue grey
  #   accent: deep orange
  palette: 
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate 
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - section-index
  - search:
      lang:
        - en
        - ja

extra_css: []


markdown_extensions:
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
